server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Baseline restrictions that do not block historical scripts or media embeds.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Static compatibility mappings only: these URLs never execute PHP.
    location = /wp-content/plugins/wp-downloadMonitor/download.php {
        if ($arg_id = "mtkidu-walk%20through%20joburg%28load%20sheddin%29.mp3") {
            return 301 "https://media.electrotrash.co.za/mtkidu/mtkidu_-_mtkidu-walk_through_joburg(load_sheddin).mp3";
        }
        return 404;
    }

    location = /wp-content/plugins/download-monitor/download.php {
        default_type text/plain;
        if ($arg_id = "211") {
            return 410 "This archived SWEAT.X download is unavailable. See /2010/01/13/grab-the-new-sweat-x-ep-savour-messiah-for-free/ for the preserved article.\n";
        }
        return 404;
    }
}
