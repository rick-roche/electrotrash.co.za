<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="8224f060-84ce-4775-b7df-621899c79cd8">
  <input type="hidden" name="subject" value="Electrotrash website contact">
  <input type="hidden" name="from_name" value="Electrotrash contact form">
  <input type="hidden" name="redirect" value="https://electrotrash.co.za/contact/thanks/">

  <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden">
    <label for="contact-website">Leave this field empty</label>
    <input type="text" id="contact-website" name="botcheck" tabindex="-1" autocomplete="off">
  </div>

  <p>
    <label for="contact-name">Name</label><br>
    <input type="text" id="contact-name" name="name" autocomplete="name" maxlength="100" required>
  </p>
  <p>
    <label for="contact-email">Email address (so we can reply)</label><br>
    <input type="email" id="contact-email" name="email" autocomplete="email" maxlength="254" required>
  </p>
  <p>
    <label for="contact-message">Message</label><br>
    <textarea id="contact-message" name="message" rows="8" maxlength="5000" required></textarea>
  </p>
  <div class="h-captcha" data-captcha="true"></div>
  <p><button type="submit">Send message</button></p>
</form>
<script src="https://web3forms.com/client/script.js" async defer></script>
